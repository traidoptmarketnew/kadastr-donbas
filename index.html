<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>

<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600;700&display=swap');
  :root {
    --bg: #0f1117; --surface: #181c27; --surface2: #1f2433; --border: #2a2f42;
    --accent: #e8c547; --red: #e05252; --green: #4caf7d; --blue: #4a9eff; --orange: #e8a547;
    --text: #d8dce8; --muted: #8b91a8;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; font-size: 13px; line-height: 1.5; display: flex; flex-direction: column; }
  header { border-bottom: 2px solid var(--accent); padding: 12px 24px; background: linear-gradient(180deg, #0d1520 0%, var(--bg) 100%); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
  header .left .label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; }
  header h1 { font-size: 17px; font-weight: 700; color: #fff; }
  header .right { display: flex; gap: 24px; font-family: 'IBM Plex Mono', monospace; font-size: 12px; }
  header .right .v { color: var(--accent); font-weight: 600; }
  header .right .l { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 1px; }
  .layout { display: flex; flex: 1; min-height: 0; }
  aside.left { width: 280px; background: var(--surface); border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; flex-shrink: 0; }
  aside.right { width: 380px; background: var(--surface); border-left: 1px solid var(--border); overflow-y: auto; flex-shrink: 0; display: flex; flex-direction: column; }
  #map { flex: 1; background: #0a0e15; }
  .filter-group { margin-bottom: 16px; }
  .filter-group > label { display: block; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .filter-group input, .filter-group select { width: 100%; padding: 8px 10px; background: var(--surface2); color: var(--text); border: 1px solid var(--border); border-radius: 4px; font-family: inherit; font-size: 12px; }
  .filter-group input:focus, .filter-group select:focus { outline: none; border-color: var(--accent); }
  .btn-reset, .btn-export { width: 100%; padding: 8px; background: transparent; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; font-family: inherit; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .btn-reset:hover { color: var(--accent); border-color: var(--accent); }
  .btn-export { background: var(--accent); color: #1a1a1a; border-color: var(--accent); font-weight: 600; }
  .btn-export:hover { background: #f5d54f; }
  .btn-export-sm { padding: 5px 10px; background: var(--accent); color: #1a1a1a; border: none; border-radius: 3px; cursor: pointer; font-family: inherit; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
  .btn-export-sm:hover { background: #f5d54f; }
  .stats-block { background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; padding: 12px; margin-bottom: 16px; }
  .stats-block h3 { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .detail-header { padding: 16px 16px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .detail-header .code { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--accent); }
  .detail-header h2 { font-size: 16px; color: #fff; margin: 4px 0; }
  .detail-header .meta { font-size: 11px; color: var(--muted); display: flex; gap: 12px; }
  .detail-empty { padding: 24px 16px; color: var(--muted); font-size: 12px; text-align: center; }
  .detail-stats { padding: 12px 16px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
  .detail-stats .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; }
  .detail-stats .row .k { color: var(--muted); }
  .detail-stats .row .v { color: var(--text); font-family: 'IBM Plex Mono', monospace; font-size: 11px; }
  .detail-stats .row .v.big { color: var(--accent); font-weight: 600; }
  .detail-section { padding: 10px 16px; border-bottom: 1px solid var(--border); }
  .detail-section h4 { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
  .bar-list .bar-row { display: flex; align-items: flex-start; gap: 8px; padding: 4px 0; font-size: 11px; border-bottom: 1px dotted var(--border); }
  .bar-list .bar-row:last-child { border-bottom: none; }
  .bar-list .bar-row .name { flex: 1; color: var(--text); word-break: break-word; line-height: 1.35; }
  .bar-list .bar-row .count { font-family: 'IBM Plex Mono', monospace; color: var(--accent); font-size: 11px; min-width: 30px; text-align: right; }
  .parcel-list { flex: 1; overflow-y: auto; padding: 8px 16px 16px; }
  .parcel-list h4 { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin: 8px 0; position: sticky; top: 0; background: var(--surface); padding: 4px 0 6px; }
  .parcel { background: var(--surface2); border: 1px solid var(--border); border-radius: 3px; padding: 8px 10px; margin-bottom: 6px; font-size: 11px; }
  .parcel .cad { font-family: 'IBM Plex Mono', monospace; color: var(--accent); font-size: 11px; cursor: pointer; word-break: break-all; }
  .parcel .cad:hover { color: var(--blue); }
  .parcel .area { float: right; font-family: 'IBM Plex Mono', monospace; color: var(--green); font-size: 11px; }
  .parcel .field { margin-top: 4px; color: var(--muted); }
  .parcel .field .label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
  .parcel .field .val { color: var(--text); }
  .council-marker { background: var(--accent); color: #1a1a1a; border-radius: 50%; border: 2px solid #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-family: 'IBM Plex Mono', monospace; box-shadow: 0 2px 8px rgba(0,0,0,0.5); cursor: pointer; transition: transform 0.15s; }
  .council-marker:hover { transform: scale(1.1); }
  .council-marker.active { background: var(--blue); color: #fff; border-color: var(--accent); }
  .leaflet-popup-content-wrapper { background: var(--surface2); color: var(--text); border-radius: 4px; border: 1px solid var(--border); }
  .leaflet-popup-content { font-size: 12px; }
  .leaflet-popup-tip { background: var(--surface2); }
  .leaflet-popup-content .pname { font-weight: 600; color: var(--accent); font-size: 13px; }
  .leaflet-popup-content .pstats { margin-top: 4px; color: var(--muted); font-size: 11px; font-family: 'IBM Plex Mono', monospace; }
  #search-results { max-height: 180px; overflow-y: auto; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; margin-top: 4px; display: none; }
  #search-results .item { padding: 6px 8px; font-size: 11px; cursor: pointer; border-bottom: 1px solid var(--border); }
  #search-results .item:last-child { border-bottom: none; }
  #search-results .item:hover { background: var(--border); }
  #search-results .item .cad { font-family: 'IBM Plex Mono', monospace; color: var(--accent); }
  #search-results .item .who { color: var(--muted); font-size: 10px; margin-top: 2px; }
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--muted); }
  @media (max-width: 900px) { aside.left, aside.right { width: 220px; } }
</style>
</head>
<body>
<header>
  <div class="left">
    <div class="label">КАДАСТРОВАЯ КАРТА</div>
    <h1>Донбас — Донецька + Луганська області</h1>
  </div>
  <div class="right">
    <div><div class="v" id="hstat-parcels">0</div><div class="l">участков</div></div>
    <div><div class="v" id="hstat-area">0</div><div class="l">га</div></div>
    <div><div class="v" id="hstat-councils">0</div><div class="l">сельсоветов</div></div>
    <div><div class="v" id="hstat-filtered">—</div><div class="l">отфильтр. участков</div></div>
    <div><div class="v" id="hstat-filtered-area">—</div><div class="l">отфильтр. га</div></div>
  </div>
</header>

<div class="layout">
  <aside class="left">
    <div class="filter-group">
      <label>Поиск (по коду совета)</label>
      <input id="search" type="text" placeholder="напр. 2310100000" autocomplete="off"/>
      <div id="search-results"></div>
    </div>
    <div class="filter-group">
      <label>Форма собственности <span style="text-transform:none;color:var(--muted);letter-spacing:0;font-size:9px">(несколько)</span></label>
      <div id="filter-ownership" style="background:var(--surface2);border:1px solid var(--border);border-radius:4px;padding:8px;font-size:11px"></div>
    </div>
    <div class="filter-group">
      <label>Категория земель</label>
      <select id="filter-category"><option value="">— все —</option></select>
    </div>
    <button class="btn-export" id="btn-export-all">📥 Выгрузить в Excel</button>
    <button class="btn-reset" id="btn-toggle-polys" style="background:transparent;color:var(--blue);border-color:var(--blue);margin-bottom:6px">⌘ Контуры участков</button>
    <button class="btn-reset" id="btn-reset">Сбросить фильтры</button>
    <div style="height: 16px"></div>
    <div class="stats-block">
      <h3>Форма собственности</h3>
      <div id="ownership-split"></div>
    </div>
    <div class="stats-block">
      <h3>Топ-категории земель</h3>
      <div id="top-categories"></div>
    </div>
  </aside>
  <div id="map"></div>
  <aside class="right">
    <div id="detail" class="detail-empty">Клик по маркеру сельсовета — детали и список участков</div>
  </aside>
</div>

<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const COUNCILS = DATA.councils;
const STATS = DATA.stats;
const FILTERS = DATA.filters;

const map = L.map('map', { zoomControl: true, attributionControl: true }).setView([48.3, 38.3], 8);
const polygonLayers = {}; const parcelGeomIndex = {}; let polygonsVisible = true;

async function ensureCouncilParcels(council) {
  if (council.parcels) return council.parcels;
  if (council._loading) return council._loading;
  council._loading = (async () => {
    try {
      const resp = await fetch(`councils/${council.code}.json`);
      if (!resp.ok) { council.parcels = []; return []; }
      const data = await resp.json();
      council.parcels = data.parcels || [];
      return council.parcels;
    } catch (e) { council.parcels = []; return []; }
  })();
  const result = await council._loading;
  delete council._loading;
  return result;
}
async function loadCouncilPolygons(code) {
  if (polygonLayers[code]) return polygonLayers[code];
  const council = COUNCILS.find(c => c.code === code);
  if (!council) return null;
  await ensureCouncilParcels(council);
  try {
    const resp = await fetch(`parcels/${code}.geojson`);
    if (!resp.ok) return null;
    const fc = await resp.json();
    const layer = L.geoJSON(fc, {
      style: f => parcelStyle(f, council),
      onEachFeature: (f, l) => {
        const cad = f.properties.cadnum;
        parcelGeomIndex[cad] = f;
        const data = (council.parcels || []).find(p => p.c === cad);
        l.bindPopup(buildParcelPopup(cad, data, council));
        l.on('mouseover', () => l.setStyle({ weight: 2, color: '#fff' }));
        l.on('mouseout',  () => layer.resetStyle(l));
      }
    });
    if (polygonsVisible) layer.addTo(map);
    polygonLayers[code] = layer;
    return layer;
  } catch (e) { return null; }
}
function parcelStyle(f, council) {
  const cad = f.properties.cadnum;
  const data = council ? council.parcels.find(p => p.c === cad) : null;
  let fill = '#888';
  if (data) {
    if (data.ot === 'Приватна власність') fill = '#4caf7d';
    else if (data.ot === 'Комунальна власність') fill = '#e8c547';
    else if (data.ot === 'Державна власність') fill = '#4a9eff';
    else fill = '#e05252';
  } else { fill = '#3a3f55'; }
  return { fillColor: fill, color: '#1a1a1a', weight: 0.6, fillOpacity: 0.5 };
}
function buildParcelPopup(cad, data, council) {
  if (!data) {
    return `<div style="font-size:12px"><div style="font-family:'IBM Plex Mono',monospace;color:#1a1a1a;font-weight:600">${cad}</div><div style="color:#666;font-size:11px">нет данных в базе</div></div>`;
  }
  return `<div style="font-size:12px;color:#1a1a1a;max-width:300px">
      <div style="font-family:'IBM Plex Mono',monospace;font-weight:600">${cad}</div>
      <div style="font-size:11px;color:#666;margin-bottom:4px">${data.a} га · ${council ? council.name : ''}</div>
      ${data.ct ? `<div><b>категория:</b> ${data.ct}</div>` : ''}
      ${data.ot ? `<div style="color:#666;font-size:10px;margin-top:4px">${data.ot}</div>` : ''}
    </div>`;
}
function togglePolygons() {
  polygonsVisible = !polygonsVisible;
  Object.values(polygonLayers).forEach(l => { if (polygonsVisible) l.addTo(map); else map.removeLayer(l); });
}
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '© OpenStreetMap', className: 'map-tiles' }).addTo(map);
const style = document.createElement('style');
style.textContent = '.map-tiles { filter: invert(0.92) hue-rotate(180deg) brightness(0.9) contrast(0.85) saturate(0.7); }';
document.head.appendChild(style);

let markers = {}; let activeCode = null;
let filterOwnership = new Set(); let filterCategory = '';

function markerSize(count) { if (count <= 1) return 18; return Math.min(54, 18 + Math.log2(count) * 4); }
function markerColor(c, fc) { if (fc === 0) return '#3a3f55'; if (fc < c.total * 0.3) return '#e08252'; return '#e8c547'; }
function parcelMatchesFilters(p) {
  if (filterOwnership.size > 0 && !filterOwnership.has(p.ot)) return false;
  if (filterCategory && p.ct !== filterCategory) return false;
  return true;
}
function hasAnyFilter() { return !!(filterOwnership.size > 0 || filterCategory); }
function getFilteredStats(council) {
  if (!hasAnyFilter()) return { count: council.total, area: council.area };
  if (council.parcels) {
    let n = 0, a = 0;
    for (const p of council.parcels) if (parcelMatchesFilters(p)) { n++; a += p.a || 0; }
    return { count: n, area: Math.round(a * 10) / 10 };
  }
  let fraction = 1.0;
  if (filterOwnership.size > 0) {
    let n = 0;
    for (const ot of filterOwnership) n += council.by_ownership[ot] || 0;
    fraction *= n / Math.max(1, council.total);
  }
  if (filterCategory) {
    const c = (council.top_categories || []).find(([n,_]) => n === filterCategory);
    fraction *= c ? c[1] / council.total : 0;
  }
  return { count: Math.round(council.total * fraction), area: Math.round(council.area * fraction * 10) / 10 };
}
function fmt(n) { return Number(n).toLocaleString('ru'); }

function buildMarkers() {
  for (const k in markers) { map.removeLayer(markers[k]); }
  markers = {};
  const hasFilter = hasAnyFilter();
  let totalCount = 0, totalArea = 0;
  COUNCILS.forEach(c => {
    if (!c.lat) return;
    const fs = getFilteredStats(c);
    totalCount += fs.count; totalArea += fs.area;
    const sz = markerSize(c.total);
    const col = markerColor(c, fs.count);
    const icon = L.divIcon({
      html: `<div class="council-marker" style="width:${sz}px;height:${sz}px;background:${col};font-size:${Math.max(9, sz/4)}px">${fs.count}</div>`,
      className: '', iconSize: [sz, sz], iconAnchor: [sz/2, sz/2]
    });
    const m = L.marker([c.lat, c.lon], { icon }).addTo(map);
    const ttArea = hasFilter ? `${fmt(fs.area)} / ${fmt(c.area)} га` : `${fmt(c.area)} га`;
    m.bindTooltip(`<div class="pname">${c.name}</div><div class="pstats">${fs.count} участков · ${ttArea}</div>`, { direction: 'top', offset: [0, -sz/2], opacity: 0.95 });
    m.on('click', () => { showDetail(c.code); loadCouncilPolygons(c.code); });
    markers[c.code] = m;
  });
  document.getElementById('hstat-filtered').textContent = hasFilter ? fmt(totalCount) : '—';
  document.getElementById('hstat-filtered-area').textContent = hasFilter ? fmt(Math.round(totalArea * 10) / 10) : '—';
}

async function showDetail(code) {
  activeCode = code;
  const c = COUNCILS.find(x => x.code === code);
  if (!c) return;
  const det = document.getElementById('detail');
  det.classList.remove('detail-empty');
  if (!c.parcels) {
    det.innerHTML = `<div class="detail-header"><div class="code">${c.code}</div><h2>${c.name}</h2><div class="meta"><span>${c.total} участков</span><span>${c.area.toLocaleString('ru')} га</span></div></div><div style="padding:16px;color:var(--muted);font-size:12px">Загружаю участки…</div>`;
  }
  await ensureCouncilParcels(c);
  if (activeCode !== code) return;
  const ownership = Object.entries(c.by_ownership).sort((a,b)=>b[1]-a[1]);
  const parcels = (c.parcels || []).filter(parcelMatchesFilters);
  const filteredArea = Math.round(parcels.reduce((s,p)=>s+(p.a||0),0) * 10) / 10;
  const hasFilter = hasAnyFilter();
  det.innerHTML = `
    <div class="detail-header">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div style="flex:1"><div class="code">${c.code}</div><h2>${c.name}</h2><div class="meta"><span>${c.total} участков</span><span>${c.area.toLocaleString('ru')} га</span></div></div>
        <button class="btn-export-sm" onclick="exportCouncil('${c.code}')">📥 Excel</button>
      </div>
    </div>
    <div class="detail-stats">
      <div class="row"><span class="k">Всего участков</span><span class="v big">${fmt(c.total)}</span></div>
      <div class="row"><span class="k">Площадь</span><span class="v big">${fmt(c.area)} га</span></div>
      <div class="row"><span class="k">Средний участок</span><span class="v">${(c.area/Math.max(1,c.total)).toFixed(2)} га</span></div>
      ${hasFilter ? `<div class="row" style="margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)"><span class="k">По фильтру: участков</span><span class="v big" style="color:var(--blue)">${fmt(parcels.length)}</span></div><div class="row"><span class="k">По фильтру: площадь</span><span class="v big" style="color:var(--blue)">${fmt(filteredArea)} га</span></div>` : ''}
    </div>
    <div class="detail-section"><h4>Форма собственности</h4><div class="bar-list">${ownership.map(([k,v])=>`<div class="bar-row"><span class="name">${escapeHtml(k)}</span><span class="count">${v}</span></div>`).join('')}</div></div>
    ${c.top_categories && c.top_categories.length ? `<div class="detail-section"><h4>Категории земель</h4><div class="bar-list">${c.top_categories.map(([k,v])=>`<div class="bar-row"><span class="name">${escapeHtml(k)}</span><span class="count">${v}</span></div>`).join('')}</div></div>` : ''}
    <div class="parcel-list" id="parcel-list">
      <h4>Участки${parcels.length !== c.total ? ` (отфильтровано: ${parcels.length})` : ` (${parcels.length})`}</h4>
      ${parcels.slice(0, 300).map(renderParcelCard).join('')}
      ${parcels.length > 300 ? `<div style="text-align:center;padding:8px;color:var(--muted);font-size:11px">показано 300 из ${parcels.length}</div>` : ''}
    </div>`;
}

function renderParcelCard(p) {
  return `<div class="parcel">
      <span class="cad" onclick="openCadastr('${p.c}')">${p.c}</span>
      <span class="area">${p.a} га</span>
      ${p.ct ? `<div class="field"><span class="label">категория: </span><span class="val">${escapeHtml(p.ct)}</span></div>` : ''}
      ${p.ot ? `<div class="field"><span class="label">собств.: </span><span class="val">${escapeHtml(p.ot)}</span></div>` : ''}
    </div>`;
}
function escapeHtml(s) { if (!s) return ''; return String(s).replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch])); }
function openCadastr(cad) { window.open(`https://kadastr.live/parcel/${cad}`, '_blank'); }

function parcelsToRows(parcels, council) {
  return parcels.map(p => ({ 'Кадастровый номер': p.c, 'Площадь, га': p.a, 'Сельсовет': council.name, 'Код сельсовета': council.code, 'Форма собственности': p.ot || '', 'Категория земель': p.ct || '' }));
}
function downloadXlsx(rows, filename, sheetName) {
  if (!rows.length) { alert('Нет данных для выгрузки'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  const widths = { 'Кадастровый номер': 24, 'Площадь, га': 12, 'Сельсовет': 22, 'Код сельсовета': 14, 'Форма собственности': 22, 'Категория земель': 38 };
  ws['!cols'] = Object.keys(rows[0]).map(k => ({ wch: widths[k] || 18 }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, sheetName || 'Участки'); XLSX.writeFile(wb, filename);
}
async function exportFiltered() {
  const need = COUNCILS.filter(c => !c.parcels);
  if (need.length > 0) {
    if (!confirm(`Будет загружено ${need.length} советов для экспорта. Продолжить?`)) return;
    for (let i=0; i<need.length; i+=10) { await Promise.all(need.slice(i, i+10).map(c => ensureCouncilParcels(c))); }
  }
  const rows = [];
  for (const c of COUNCILS) { for (const p of (c.parcels || [])) { if (parcelMatchesFilters(p)) rows.push(parcelsToRows([p], c)[0]); } }
  const stamp = new Date().toISOString().slice(0,10);
  const tags = [];
  if (filterOwnership.size > 0) tags.push('собств_' + Array.from(filterOwnership).join('_').slice(0,40).replace(/[^а-яА-Яa-zA-Z0-9]/g,'_'));
  if (filterCategory) tags.push('кат_' + filterCategory.slice(0,30).replace(/[^а-яА-Яa-zA-Z0-9]/g,'_'));
  const suffix = tags.length ? tags.join('__') : 'все';
  downloadXlsx(rows, `Запоріжжя_${suffix}_${stamp}.xlsx`, 'Участки');
}
async function exportCouncil(code) {
  const c = COUNCILS.find(x => x.code === code);
  if (!c) return;
  await ensureCouncilParcels(c);
  const parcels = (c.parcels || []).filter(parcelMatchesFilters);
  const rows = parcelsToRows(parcels, c);
  const stamp = new Date().toISOString().slice(0,10);
  const safe = c.name.replace(/[^а-яА-Яa-zA-Z0-9]/g,'_');
  downloadXlsx(rows, `${safe}_${stamp}.xlsx`, c.name.slice(0,30));
}

function renderSidebar() {
  const os = document.getElementById('ownership-split');
  os.innerHTML = Object.entries(STATS.ownership_split).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="bar-row" style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:4px 0;font-size:11px;line-height:1.35"><span class="name" style="flex:1;color:var(--text);word-break:break-word">${escapeHtml(k)}</span><span class="count" style="font-family:'IBM Plex Mono',monospace;color:var(--accent);min-width:36px;text-align:right;flex-shrink:0">${v}</span></div>`).join('');
  const tc = document.getElementById('top-categories');
  tc.innerHTML = (STATS.top_categories || []).map(([k,v])=>`<div class="bar-row" style="display:flex;align-items:flex-start;justify-content:space-between;gap:8px;padding:4px 0;font-size:11px;line-height:1.35;cursor:pointer" onclick="selectCategory(${JSON.stringify(k)})"><span class="name" style="flex:1;color:var(--text);word-break:break-word">${escapeHtml(k)}</span><span class="count" style="font-family:'IBM Plex Mono',monospace;color:var(--accent);min-width:36px;text-align:right;flex-shrink:0">${v}</span></div>`).join('');
  document.getElementById('hstat-parcels').textContent = STATS.total_parcels.toLocaleString('ru');
  document.getElementById('hstat-area').textContent = STATS.total_area.toLocaleString('ru');
  document.getElementById('hstat-councils').textContent = STATS.councils;
  const fo = document.getElementById('filter-ownership');
  fo.innerHTML = FILTERS.ownership.map(r=>`<label style="display:flex;align-items:flex-start;gap:6px;padding:4px 0;cursor:pointer;line-height:1.3;font-size:11px;color:var(--text);text-transform:none;letter-spacing:0;font-weight:400;margin:0"><input type="checkbox" value="${escapeHtml(r)}" data-ownership style="margin:1px 0 0 0;flex-shrink:0;width:13px;height:13px;accent-color:var(--accent)"/><span style="flex:1;min-width:0;word-break:break-word;overflow-wrap:anywhere">${escapeHtml(r)}</span></label>`).join('');
  fo.querySelectorAll('input[data-ownership]').forEach(cb => {
    cb.addEventListener('change', () => {
      filterOwnership = new Set(Array.from(fo.querySelectorAll('input[data-ownership]:checked')).map(x => x.value));
      buildMarkers(); if (activeCode) showDetail(activeCode);
    });
  });
  const fc = document.getElementById('filter-category');
  FILTERS.categories.forEach(r => { const short = r.length > 60 ? r.slice(0,57)+'…' : r; fc.add(new Option(short, r)); });
}
function selectCategory(name) { document.getElementById('filter-category').value = name; filterCategory = name; buildMarkers(); if (activeCode) showDetail(activeCode); }

document.getElementById('filter-category').addEventListener('change', e => { filterCategory = e.target.value; buildMarkers(); if (activeCode) showDetail(activeCode); });
document.getElementById('btn-export-all').addEventListener('click', exportFiltered);
document.getElementById('btn-toggle-polys').addEventListener('click', togglePolygons);
document.getElementById('btn-reset').addEventListener('click', () => {
  filterOwnership = new Set(); filterCategory = '';
  document.querySelectorAll('#filter-ownership input[data-ownership]').forEach(cb => cb.checked = false);
  document.getElementById('filter-category').value = '';
  document.getElementById('search').value = '';
  document.getElementById('search-results').style.display = 'none';
  buildMarkers(); if (activeCode) showDetail(activeCode);
});

const search = document.getElementById('search');
const sr = document.getElementById('search-results');
search.addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  if (q.length < 4) { sr.style.display = 'none'; return; }
  const results = [];
  const qn = q.replace(/[^0-9]/g, '');
  for (const c of COUNCILS) {
    if (qn && c.code.startsWith(qn.slice(0,10))) {
      results.push({ council: c });
      if (results.length >= 50) break;
    }
  }
  if (!results.length) { sr.innerHTML = '<div class="item" style="color:var(--muted)">Ничего не найдено</div>'; sr.style.display='block'; return; }
  sr.innerHTML = results.map((r,i)=>`<div class="item" data-i="${i}"><div class="cad">${escapeHtml(r.council.code)}</div><div class="who">${escapeHtml(r.council.name)} · ${r.council.total} уч.</div></div>`).join('');
  sr.style.display = 'block';
  sr.querySelectorAll('.item').forEach((el,i) => {
    el.addEventListener('click', () => {
      const r = results[i];
      if (r.council.lat) map.flyTo([r.council.lat, r.council.lon], 13, { duration: 0.6 });
      showDetail(r.council.code);
      sr.style.display = 'none';
    });
  });
});
document.addEventListener('click', e => { if (!e.target.closest('.filter-group')) sr.style.display = 'none'; });

renderSidebar();
buildMarkers();
const bounds = L.latLngBounds(COUNCILS.filter(c=>c.lat).map(c=>[c.lat,c.lon]));
if (bounds.isValid()) map.fitBounds(bounds, { padding: [40, 40] });
</script>
</body>
</html>
